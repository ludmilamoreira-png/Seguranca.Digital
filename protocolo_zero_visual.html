
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Protocolo Zero – Segurança em Risco</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');

body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg, #020617, #0f172a);
  color: #e5e7eb;
  display: flex;
  align-items: center;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 900px;
  padding: 24px;
}

.card {
  background: rgba(15, 23, 42, 0.9);
  border-radius: 20px;
  padding: 32px;
  box-shadow: 0 25px 50px rgba(0,0,0,.45);
  animation: fadeIn .5s ease;
}

h1 {
  text-align: center;
  margin-bottom: 10px;
  letter-spacing: 1px;
}

.subtitle {
  text-align: center;
  opacity: .8;
  margin-bottom: 30px;
}

h2 {
  margin-top: 0;
}

.options button {
  width: 100%;
  margin: 12px 0;
  padding: 16px;
  border-radius: 14px;
  border: none;
  background: linear-gradient(135deg, #1e293b, #334155);
  color: #e5e7eb;
  font-size: 16px;
  cursor: pointer;
  transition: all .25s ease;
}

.options button:hover {
  transform: scale(1.02);
  background: linear-gradient(135deg, #2563eb, #1d4ed8);
}

.feedback {
  margin-top: 20px;
  font-size: 18px;
  font-weight: 600;
}

.ok { color: #22c55e; }
.bad { color: #ef4444; }

.center {
  text-align: center;
}

.main-btn {
  margin-top: 20px;
  padding: 14px 32px;
  border-radius: 999px;
  border: none;
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: #022c22;
  font-size: 16px;
  cursor: pointer;
  transition: transform .2s ease;
}

.main-btn:hover {
  transform: scale(1.05);
}

.hidden { display: none; }

.footer {
  text-align: center;
  margin-top: 18px;
  font-size: 12px;
  opacity: .6;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="container">
  <div id="start" class="card center">
    <h1>PROTOCOLO ZERO</h1>
    <p class="subtitle">Segurança Digital em Risco</p>
    <p>Uma empresa da Indústria 4.0 sofreu ameaças digitais.<br>
    Sua missão é ativar os protocolos corretos para proteger os dados.</p>
    <button class="main-btn" onclick="startGame()">Iniciar Missão</button>
  </div>

  <div id="game" class="card hidden">
    <h2 id="title"></h2>
    <p id="question"></p>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="center">
      <button id="nextBtn" class="main-btn hidden" onclick="next()">Continuar</button>
    </div>
  </div>

  <div id="end" class="card hidden center">
    <h1>Missão Finalizada</h1>
    <p id="result"></p>
    <button class="main-btn" onclick="restart()">Jogar Novamente</button>
  </div>

  <div class="footer">Jogo digital original • Desenvolvido por Ludmila Moreira</div>
</div>

<script>
const stages = [
  {
    title: "Protocolo 1 – Controle de Acesso",
    question: "Funcionários acessam dados sigilosos sem autorização. Qual ação é correta?",
    options: [
      {t:"Liberar acesso geral", ok:false},
      {t:"Criar controle de acesso e autenticação", ok:true},
      {t:"Ignorar o problema", ok:false}
    ]
  },
  {
    title: "Protocolo 2 – Integridade da Informação",
    question: "Um relatório foi alterado e ninguém sabe por quem.",
    options: [
      {t:"Aceitar a alteração", ok:false},
      {t:"Restaurar backup e registrar alterações", ok:true},
      {t:"Apagar o relatório", ok:false}
    ]
  },
  {
    title: "Protocolo 3 – Responsabilidade Digital",
    question: "Um contrato digital foi assinado, mas o responsável nega a ação.",
    options: [
      {t:"Cancelar o contrato", ok:false},
      {t:"Usar assinatura digital com validade legal", ok:true},
      {t:"Refazer tudo em papel", ok:false}
    ]
  },
  {
    title: "Protocolo 4 – Continuidade",
    question: "Um ataque tira os sistemas do ar durante a produção.",
    options: [
      {t:"Esperar normalizar", ok:false},
      {t:"Ter backup e redundância", ok:true},
      {t:"Desligar tudo", ok:false}
    ]
  },
  {
    title: "Tecnologia Estratégica",
    question: "Qual tecnologia auxilia treinamentos e manutenção industrial de forma interativa?",
    options: [
      {t:"Realidade Virtual", ok:false},
      {t:"Realidade Aumentada", ok:true},
      {t:"Redes Sociais", ok:false}
    ]
  }
];

let index = 0;
let score = 0;

function startGame(){
  document.getElementById('start').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  render();
}

function render(){
  const s = stages[index];
  document.getElementById('title').innerText = s.title;
  document.getElementById('question').innerText = s.question;
  const opts = document.getElementById('options');
  opts.innerHTML = "";
  document.getElementById('feedback').innerText = "";
  document.getElementById('nextBtn').classList.add('hidden');
  s.options.forEach(o=>{
    const b = document.createElement('button');
    b.innerText = o.t;
    b.onclick = ()=> choose(o.ok);
    opts.appendChild(b);
  });
}

function choose(ok){
  const fb = document.getElementById('feedback');
  if(ok){ score++; fb.innerHTML = "<span class='ok'>✔ Protocolo ativado com sucesso</span>"; }
  else{ fb.innerHTML = "<span class='bad'>✖ Falha de segurança detectada</span>"; }
  document.getElementById('nextBtn').classList.remove('hidden');
}

function next(){
  index++;
  if(index < stages.length){ render(); }
  else{
    document.getElementById('game').classList.add('hidden');
    document.getElementById('end').classList.remove('hidden');
    document.getElementById('result').innerText =
      score >= 4 ? "Sistema protegido! Excelente tomada de decisões ("+score+"/"+stages.length+")"
                 : "Risco elevado! Alguns protocolos falharam ("+score+"/"+stages.length+")";
  }
}

function restart(){
  index = 0; score = 0;
  document.getElementById('end').classList.add('hidden');
  document.getElementById('start').classList.remove('hidden');
}
</script>

</body>
</html>
